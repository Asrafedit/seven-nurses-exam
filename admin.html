<!doctype html>
<html lang="bn">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>SEVEN NURSES - Admin Panel</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="app-container">

<header class="header">

<img id="logo" class="logo">

<div class="head-main">

<div id="title" class="head-title">
SEVEN NURSES
</div>

<div id="sub" class="head-sub">
ADMIN PANEL
</div>

</div>

</header>

<main>

<section id="login" class="card">

<h2 class="center">
Admin Login
</h2>

<label>Admin Email</label>

<input id="email" type="email">

<label>Password</label>

<input id="password" type="password">

<button
class="btn btn-blue"
onclick="login()">
Login
</button>

<button
class="btn btn-gray"
onclick="location.href='/'">
Student Login
</button>

</section>

<section id="panel" class="hidden">

<div class="admin-nav">

<button data-tab="dashboard"
onclick="tab('dashboard')">
Dashboard
</button>

<button data-tab="questions"
onclick="tab('questions')">
Questions
</button>

<button data-tab="results"
onclick="tab('results')">
Results
</button>

<button data-tab="settings"
onclick="tab('settings')">
Settings
</button>

</div>

<div id="dashboard"
class="tab card">
</div>

<div id="questions"
class="tab card hidden">
</div>

<div id="results"
class="tab card hidden">
</div>

<div id="settings"
class="tab card hidden">
</div>

</section>

</main>

<div id="toast" class="toast"></div>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
updatePassword
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


const cfg={
apiKey:"AIzaSyArek6tP3kPlGpngJ1gn6MNpFzOh28JpiQ",
authDomain:"seven-nurses8.firebaseapp.com",
projectId:"seven-nurses8",
storageBucket:"seven-nurses8.firebasestorage.app",
messagingSenderId:"912003149859",
appId:"1:912003149859:web:d4a4f41a6060b37275c196",
measurementId:"G-YS5KRB087J"
};

const auth=getAuth(initializeApp(cfg));

const $=id=>document.getElementById(id);

const esc=v=>
String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);


function toast(t){

const x=$("toast");

x.textContent=t;

x.style.display="block";

setTimeout(
()=>x.style.display="none",
2500
);

}


async function api(path,opt={}){

const u=
opt.token||
localStorage.getItem("sn_admin_token");

const h={
"Content-Type":"application/json"
};

if(u)
h.Authorization="Bearer "+u;

const r=await fetch(
path,
{
...opt,
headers:h
}
);

const raw=await r.text();

let d={};

try{
d=JSON.parse(raw);
}
catch{
d={error:raw};
}

if(!r.ok)
throw Error(
d.error||
d.message||
("HTTP "+r.status)
);

return d;
}


async function login(){

try{

const c=
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

localStorage.setItem(
"sn_admin_token",
await c.user.getIdToken(true)
);

$("login").classList.add("hidden");

$("panel").classList.remove("hidden");

await loadAll();

tab("dashboard");

}
catch(e){

toast(e.message);

}

}


let data={};


async function loadAll(){

try{

data.bootstrap=
await api("/api/bootstrap");

data.stats=
await api("/api/admin/stats");

data.exams=
await api("/api/admin/exams");

data.students=
await api("/api/admin/students");

data.results=
await api("/api/admin/results");

data.notifications=
await api("/api/admin/notifications");

}
catch(e){

toast(e.message);

}

}


function tab(id){

document
.querySelectorAll(".tab")
.forEach(x=>x.classList.add("hidden"));

$(id).classList.remove("hidden");

document
.querySelectorAll(".admin-nav button")
.forEach(
b=>b.classList.toggle(
"active",
b.dataset.tab===id
)
);

if(id==="dashboard")
renderDashboard();

if(id==="questions")
renderQuestions();

if(id==="results")
renderResults();

if(id==="settings")
renderSettings();

}


function renderDashboard(){

$("dashboard").innerHTML=`

<h3>Dashboard</h3>

<div class="stat-grid">

<div class="stat">
<b>
${data.stats?.students??
data.students?.students?.length??0}
</b>
Students
</div>

<div class="stat">
<b>
${data.stats?.exams??
data.exams?.exams?.length??0}
</b>
Exams
</div>

<div class="stat">
<b>
${data.stats?.results??
data.results?.results?.length??0}
</b>
Results
</div>

<div class="stat">
<b>
${data.notifications?.notifications?.length??0}
</b>
Notifications
</div>

</div>

<div class="setting-box">

<h4>Recent Notifications</h4>

${
(data.notifications?.notifications||[])
.slice(0,10)
.map(n=>`

<div class="item">

<div class="item-main">

<div class="item-title">
${esc(n.title||"Result Submitted")}
</div>

<div class="item-sub">
${esc(n.body||"")}
</div>

</div>

</div>

`)
.join("")
||
"<p class='small'>No notifications.</p>"
}

</div>

`;

}


async function renderQuestions(){

let ex=
(data.exams?.exams||[]);

$("questions").innerHTML=`

<h3>Question Management</h3>

<label>Examination</label>

<select id="qExam">

${ex.map(e=>`

<option value="${esc(e.id)}">
${esc(e.title||e.name)}
</option>

`).join("")}

</select>

<div id="qForm"></div>

<div id="qList"
class="setting-box">
</div>

`;

buildQForm();

$("qExam").onchange=buildQForm;

}


function buildQForm(){

let id=$("qExam").value;

$("qForm").innerHTML=`

<div class="setting-box">

<h4>Add 5-Statement Question</h4>

<label>Question</label>

<textarea
id="qt"
rows="3">
</textarea>

${["A","B","C","D","E"].map(k=>`

<label>
Statement ${k}
</label>

<input
id="q${k}"
placeholder="Statement ${k}">

<select id="a${k}">

<option value="true">
TRUE
</option>

<option value="false">
FALSE
</option>

</select>

`).join("")}

<button
class="btn btn-green"
onclick="saveQ()">
Add Question
</button>

</div>

`;

loadQList(id);

}


async function loadQList(id){

try{

const d=
await api(
"/api/admin/questions/"
+encodeURIComponent(id)
);

$("qList").innerHTML=

(d.questions||[])
.map((q,i)=>`

<div class="item">

<div class="item-main">

<div class="item-title">

Q${i+1}.
${esc(q.question||q.title)}

</div>

</div>

<button
class="btn btn-red btn-small"
onclick="delQ('${q.id}')">
Delete
</button>

</div>

`)
.join("")
||
"<p class='small'>No questions.</p>";

}
catch(e){

toast(e.message);

}

}


async function saveQ(){

const examId=$("qExam").value;

const opts={};

for(
const k of ["A","B","C","D","E"]
){

opts[k]={
text:$("q"+k).value.trim(),
correct:$("a"+k).value==="true"
};

}

if(
!$("qt").value.trim()||
Object.values(opts).some(x=>!x.text)
)
return toast(
"সব প্রশ্ন ও Statement পূরণ করুন।"
);

try{

await api(
"/api/admin/questions",
{
method:"POST",
body:JSON.stringify({
examId,
question:$("qt").value.trim(),
options:opts,
mark:1
})
}
);

toast("Question added");

buildQForm();

}
catch(e){

toast(e.message);

}

}


async function delQ(id){

if(!confirm("Delete this question?"))
return;

try{

await api(
"/api/admin/questions/"
+encodeURIComponent(id),
{
method:"DELETE"
}
);

buildQForm();

}
catch(e){

toast(e.message);

}

}


function renderResults(){

const rs=
data.results?.results||[];

$("results").innerHTML=`

<h3>
Student Results & History
</h3>

<button
class="btn btn-red"
onclick="clearResults()">
Clear All History
</button>

<div
class="table-wrap"
style="margin-top:10px">

<table>

<thead>

<tr>

<th>Rank</th>
<th>Name</th>
<th>Exam</th>
<th>Score</th>
<th>Grade</th>
<th>Status</th>
<th>Date</th>

</tr>

</thead>

<tbody>

${rs.map(r=>`

<tr>

<td>${esc(r.rank)}</td>

<td>
${esc(r.studentName||r.name)}
</td>

<td>
${esc(r.examTitle||r.examName)}
</td>

<td>
${esc(r.score)}/${esc(r.total)}
</td>

<td>
${esc(r.grade)}
</td>

<td>
${esc(r.status)}
</td>

<td>
${esc(r.submittedAt||r.date)}
</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`;

}


async function clearResults(){

if(!confirm("সব Result History মুছে ফেলবেন?"))
return;

try{

await api(
"/api/admin/results",
{
method:"DELETE"
}
);

await loadAll();

renderResults();

}
catch(e){

toast(e.message);

}

}


function renderSettings(){

const s=
data.bootstrap?.settings||{};

$("settings").innerHTML=`

<h3>
System Settings
</h3>

<div class="setting-box">

<h4>
System Information
</h4>

<label>
Site Name
</label>

<input
id="sName"
value="${esc(s.siteName||"SEVEN NURSES")}">

<label>
Subtitle
</label>

<input
id="sSub"
value="${esc(s.subtitle||"ONLINE EXAM SYSTEM")}">

<label>
Logo URL
</label>

<input
id="sLogo"
value="${esc(s.logoUrl||"")}">

<label>
Header Background URL
</label>

<input
id="sHead"
value="${esc(s.headerBackgroundUrl||"")}">

<label>
Whole-site Background URL
</label>

<input
id="sBg"
value="${esc(s.backgroundUrl||"")}">

<label>
Notice
</label>

<textarea id="sNotice">
${esc(s.notice||"")}
</textarea>

<label>
Footer
</label>

<input
id="sFoot"
value="${esc(s.footerText||"")}">

<label>
Common Student Exam PIN
</label>

<input
id="sPin"
value="${esc(s.commonExamPin||"")}">

<button
class="btn btn-green"
onclick="saveSettings()">
Save Settings
</button>

</div>


<div class="setting-box">

<h4>
Admin Password
</h4>

<p class="small">
Firebase Authentication-এর password ব্যবহার করা হবে।
</p>

<label>
New Password
</label>

<input
id="newPass"
type="password">

<button
class="btn btn-blue"
onclick="changePass()">
Update Password
</button>

</div>


<div class="setting-box">

<h4>
Students
</h4>

${
(data.students?.students||[])
.map(x=>`

<div class="item">

<div class="item-main">

<div class="item-title">
${esc(x.name)}
</div>

<div class="item-sub">
${x.active===false
?"Inactive"
:"Active"}
</div>

</div>

</div>

`)
.join("")
||
"<p class='small'>No students.</p>"
}

</div>

`;

}


async function saveSettings(){

const body={

siteName:$("sName").value.trim(),

subtitle:$("sSub").value.trim(),

logoUrl:$("sLogo").value.trim(),

headerBackgroundUrl:
$("sHead").value.trim(),

backgroundUrl:
$("sBg").value.trim(),

notice:$("sNotice").value,

footerText:$("sFoot").value.trim(),

commonExamPin:
$("sPin").value.trim()

};

try{

await api(
"/api/admin/settings",
{
method:"PUT",
body:JSON.stringify(body)
}
);

toast("Settings saved");

await loadAll();

renderSettings();

}
catch(e){

toast(e.message);

}

}


async function changePass(){

const p=$("newPass").value;

if(!p||p.length<6)
return toast(
"Password কমপক্ষে 6 characters দিন।"
);

try{

await auth.currentUser.updatePassword(p);

toast("Password changed");

$("newPass").value="";

}
catch(e){

toast(e.message);

}

}


window.login=login;
window.tab=tab;
window.saveQ=saveQ;
window.delQ=delQ;
window.clearResults=clearResults;
window.saveSettings=saveSettings;
window.changePass=changePass;

</script>

</body>
  </html>
