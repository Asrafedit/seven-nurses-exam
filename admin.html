<!doctype html>
<html lang="bn">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
SEVEN NURSES - Admin Panel
</title>

<link
rel="stylesheet"
href="/style.css"
>

</head>


<body>

<div class="admin-shell">


<header class="header">

  <div class="brand">

    <div class="logo-wrap">

      <img
        id="adminLogo"
        class="logo"
        alt="Logo"
      >

    </div>

    <div>

      <div class="head-title">
        SEVEN NURSES
      </div>

      <div class="head-sub">
        ADMIN PANEL
      </div>

    </div>

  </div>


  <button
    id="logout"
    class="btn btn-red btn-mini"
    hidden
  >
    Logout
  </button>

</header>


<main class="admin-main">


<section
id="loginBox"
class="card"
>

  <div class="section-title">
    Admin Login
  </div>

  <div class="title-line"></div>


  <label for="email">
    Admin Email
  </label>

  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Admin Gmail"
  >


  <label for="password">
    Password
  </label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Password"
  >


  <div
    id="loginMsg"
    class="login-note"
  >
    Firebase Authentication দিয়ে Admin Login করুন।
  </div>


  <button
    id="loginBtn"
    class="btn btn-blue"
  >
    Login
  </button>


  <button
    class="btn btn-gray"
    onclick="location.href='/'"
  >
    Student Login
  </button>

</section>


<section id="panel" hidden>


<div class="admin-grid">

  <button
    class="admin-tab active"
    onclick="showAdminTab('dashboardTab',this)"
  >
    Dashboard
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('studentsTab',this)"
  >
    Students
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('examsTab',this)"
  >
    Exams
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('questionsTab',this)"
  >
    Questions
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('resultsTab',this)"
  >
    Results
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('notificationsTab',this)"
  >
    Notifications
  </button>

  <button
    class="admin-tab"
    onclick="showAdminTab('settingsTab',this)"
  >
    Settings
  </button>

</div>


<section
id="dashboardTab"
class="admin-card admin-tab-content"
>

<h3>
Dashboard
</h3>

<div
id="dashboardStats"
class="stat-grid"
></div>


<div class="admin-card">

<h3>
Recent Notifications
</h3>

<div
id="dashboardNotifications"
class="notice-list"
></div>

</div>

</section>


<section
id="studentsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
Students
</h3>

<div class="form-grid">

<input
id="studentName"
class="full"
placeholder="Registered Student Name"
>

<button
class="btn btn-green"
onclick="saveStudent()"
>
Add Student
</button>

</div>


<div
id="students"
style="margin-top:10px"
></div>

</section>


<section
id="examsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
Examinations
</h3>

<div class="form-grid">

<input
id="examTitleInput"
class="full"
placeholder="Exam Title"
>

<input
id="examDuration"
type="number"
min="1"
value="30"
placeholder="Duration (minutes)"
>

<input
id="examPass"
type="number"
min="0"
max="100"
value="40"
placeholder="Pass Mark %"
>

<button
class="btn btn-green"
onclick="saveExam()"
>
Create Examination
</button>

</div>


<div
id="exams"
style="margin-top:10px"
></div>

</section>


<section
id="questionsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
Question Management
</h3>


<label for="examSelect">
Select Examination
</label>


<select
id="examSelect"
onchange="loadQuestions()"
></select>


<div
id="questionForm"
class="admin-card"
></div>


<div
id="questions"
></div>

</section>


<section
id="resultsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
Results & History
</h3>


<div
id="results"
class="table-wrap"
></div>

</section>


<section
id="notificationsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
Notifications
</h3>


<div
id="notifications"
class="notice-list"
></div>

</section>


<section
id="settingsTab"
class="admin-card admin-tab-content hidden"
>

<h3>
System Settings
</h3>


<div class="admin-card">


<div class="form-grid">


<div>

<label>
Site Name
</label>

<input id="siteName">

</div>


<div>

<label>
Header Title
</label>

<input id="headerTitle">

</div>


<div>

<label>
Subtitle
</label>

<input id="subtitle">

</div>


<div>

<label>
Logo URL
</label>

<input id="logoUrl">

</div>


<div>

<label>
Background URL
</label>

<input id="backgroundUrl">

</div>


<div>

<label>
Common Exam PIN
</label>

<input
id="commonExamPin"
inputmode="numeric"
>

</div>


<div class="full">

<label>
Notice
</label>

<textarea
id="notice"
rows="3"
></textarea>

</div>


<div class="full">

<label>
Footer Text
</label>

<input id="footerText">

</div>


</div>


<button
class="btn btn-green"
onclick="saveSettings()"
>
Save Settings
</button>

</div>


<div class="admin-card">

<h3>
Change Admin Password
</h3>


<input
id="oldPass"
type="password"
placeholder="Current Password"
>


<input
id="newPass"
type="password"
placeholder="New Password"
>


<input
id="newPass2"
type="password"
placeholder="Confirm New Password"
>


<button
class="btn btn-blue"
onclick="changePassword()"
>
Change Password
</button>


<div
id="passMsg"
class="login-note"
></div>

</div>


</section>


</section>


</main>

</div>


<script>

function showAdminTab(id,btn){

  document
    .querySelectorAll(
      '.admin-tab-content'
    )
    .forEach(
      x=>x.classList.add('hidden')
    );


  document
    .getElementById(id)
    .classList.remove('hidden');


  document
    .querySelectorAll(
      '.admin-tab'
    )
    .forEach(
      x=>x.classList.remove('active')
    );


  if(btn){
    btn.classList.add('active');
  }

}

window.showAdminTab=
  showAdminTab;

</script>


<script
type="module"
src="/admin.js"
></script>


</body>
    </html>
