<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEVEN NURSES — Admin Panel</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>

<body>

<div class="admin-shell">

  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="brand">

      <div class="logo-wrap">
        <img
          id="adminLogo"
          class="logo"
          alt="SEVEN NURSES"
        >
      </div>

      <div>

        <div class="head-title">
          SEVEN NURSES
        </div>

        <div class="head-sub">
          ADMIN CONTROL PANEL
        </div>

      </div>

    </div>

    <button
      id="logout"
      class="btn btn-red btn-mini"
      hidden
    >
      Logout
    </button>

  </header>


  <!-- ================= LOGIN ================= -->

  <main class="admin-main">

    <section
      id="loginBox"
      class="card login-card"
    >

      <div class="section-title">
        Admin Login
      </div>

      <div class="title-line"></div>


      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter admin email"
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >


      <button
        id="loginBtn"
        class="btn btn-green"
      >
        Login
      </button>


      <div
        id="loginMsg"
        class="login-note"
      ></div>

    </section>


    <!-- ================= ADMIN PANEL ================= -->

    <section
      id="panel"
      hidden
    >

      <!-- Dashboard -->

      <div
        id="dashboard"
        class="admin-card"
      >

        <h3>
          Dashboard
        </h3>

        <div
          id="dashboardStats"
          class="stat-grid"
        ></div>

        <div
          id="dashboardNotifications"
          class="notice-list"
        ></div>

      </div>


      <!-- Navigation -->

      <div class="admin-grid">

        <button
          class="admin-tab active"
          data-section="dashboardSection"
        >
          Dashboard
        </button>

        <button
          class="admin-tab"
          data-section="studentsSection"
        >
          Students
        </button>

        <button
          class="admin-tab"
          data-section="examsSection"
        >
          Exams
        </button>

        <button
          class="admin-tab"
          data-section="questionsSection"
        >
          Questions
        </button>

        <button
          class="admin-tab"
          data-section="resultsSection"
        >
          Results
        </button>

        <button
          class="admin-tab"
          data-section="notificationsSection"
        >
          Notifications
        </button>

        <button
          class="admin-tab"
          data-section="settingsSection"
        >
          Settings
        </button>

      </div>


      <!-- ================= STUDENTS ================= -->

      <section
        id="studentsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Student Management
        </h3>


        <div class="form-grid">

          <div>

            <label>
              Student Name
            </label>

            <input
              id="studentName"
              placeholder="Student name"
            >

          </div>

          <div>

            <label>
              Action
            </label>

            <button
              class="btn btn-green"
              onclick="saveStudent()"
            >
              Add Student
            </button>

          </div>

        </div>


        <div id="students"></div>

      </section>


      <!-- ================= EXAMS ================= -->

      <section
        id="examsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Examination Management
        </h3>


        <label>
          Examination Title
        </label>

        <input
          id="examTitleInput"
          placeholder="Example: Nursing Model Test"
        >


        <div class="form-grid">

          <div>

            <label>
              Duration — Minutes
            </label>

            <input
              id="examDuration"
              type="number"
              min="1"
              value="30"
            >

          </div>


          <div>

            <label>
              Pass Mark — %
            </label>

            <input
              id="examPass"
              type="number"
              min="0"
              max="100"
              value="40"
            >

          </div>

        </div>


        <button
          class="btn btn-green"
          onclick="saveExam()"
        >
          Add Examination
        </button>


        <div id="exams"></div>

      </section>


      <!-- ================= QUESTIONS ================= -->

      <section
        id="questionsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Question Management
        </h3>


        <label>
          Select Examination
        </label>

        <select
          id="examSelect"
          onchange="loadQuestions()"
        >
          <option value="">
            Select examination
          </option>
        </select>


        <div
          id="questionForm"
          class="admin-card"
        ></div>


        <div id="questions"></div>

      </section>


      <!-- ================= RESULTS ================= -->

      <section
        id="resultsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Examination Results
        </h3>


        <div class="table-wrap">

          <div id="results"></div>

        </div>

      </section>


      <!-- ================= NOTIFICATIONS ================= -->

      <section
        id="notificationsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Notifications
        </h3>


        <div id="notifications"></div>

      </section>


      <!-- ================= SETTINGS ================= -->

      <section
        id="settingsSection"
        class="admin-card"
        hidden
      >

        <h3>
          Website Settings
        </h3>


        <label>
          Site Name
        </label>

        <input id="siteName">


        <label>
          Header Title
        </label>

        <input id="headerTitle">


        <label>
          Subtitle
        </label>

        <input id="subtitle">


        <label>
          Logo URL
        </label>

        <input id="logoUrl">


        <label>
          Background URL
        </label>

        <input id="backgroundUrl">


        <label>
          Notice
        </label>

        <textarea
          id="notice"
          rows="3"
        ></textarea>


        <label>
          Footer Text
        </label>

        <input id="footerText">


        <label>
          Common Exam PIN
        </label>

        <input
          id="commonExamPin"
          type="text"
        >


        <button
          class="btn btn-green"
          onclick="saveSettings()"
        >
          Save Settings
        </button>

      </section>


      <!-- ================= PASSWORD ================= -->

      <section class="admin-card">

        <h3>
          Change Admin Password
        </h3>


        <label>
          Current Password
        </label>

        <input
          id="oldPass"
          type="password"
        >


        <label>
          New Password
        </label>

        <input
          id="newPass"
          type="password"
        >


        <label>
          Confirm New Password
        </label>

        <input
          id="newPass2"
          type="password"
        >


        <button
          class="btn btn-blue"
          onclick="changePassword()"
        >
          Change Password
        </button>


        <div
          id="passMsg"
          class="login-note"
        ></div>

      </section>

    </section>

  </main>


  <footer class="footer">
    © 2025 Seven Nurses. All rights reserved.
  </footer>

</div>


<script type="module" src="/admin.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const tabs =
      document.querySelectorAll(
        ".admin-tab"
      );

    const sections =
      document.querySelectorAll(
        "#panel > section, #panel > .admin-card"
      );


    tabs.forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          const target =
            tab.dataset.section;


          document
            .querySelectorAll(
              "#panel > section"
            )
            .forEach(section => {

              section.hidden =
                section.id !== target;

            });


          document
            .querySelectorAll(
              ".admin-tab"
            )
            .forEach(x => {

              x.classList.remove(
                "active"
              );

            });


          tab.classList.add(
            "active"
          );

        }
      );

    });

  }
);

</script>

</body>
        </html>
