<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SEVEN NURSES</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div>SEVEN NURSES — Admin</div><button id="logout" hidden>Logout</button></header><main id="loginBox" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Admin Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></main><main id="panel" hidden><section class="grid"><div class="card"><h3>Settings</h3><input id="siteName" placeholder="Site name"><input id="headerTitle" placeholder="Header title"><input id="subtitle" placeholder="Subtitle"><input id="logoUrl" placeholder="Logo URL"><input id="backgroundUrl" placeholder="Background URL"><textarea id="notice" placeholder="Notice"></textarea><input id="footerText" placeholder="Footer"><input id="commonExamPin" placeholder="Common Exam PIN"><button onclick="saveSettings()">Save Settings</button></div><div class="card"><h3>Change Admin Password</h3><input id="oldPass" type="password" placeholder="Current password"><input id="newPass" type="password" placeholder="New password"><input id="newPass2" type="password" placeholder="Confirm new password"><button onclick="changePassword()">Change Password</button><p id="passMsg"></p></div></section><section class="card"><h3>Students</h3><input id="studentName" placeholder="Student name"><button onclick="saveStudent()">Add Student</button><div id="students"></div></section><section class="card"><h3>Exams</h3><input id="examTitleInput" placeholder="Exam title"><input id="examDuration" type="number" value="30" placeholder="Minutes"><input id="examPass" type="number" value="40" placeholder="Pass %"><button onclick="saveExam()">Add Exam</button><div id="exams"></div></section><section class="card"><h3>Questions</h3><select id="examSelect" onchange="loadQuestions()"></select><div id="questionForm"></div><div id="questions"></div></section><section class="card"><h3>Results</h3><div id="results"></div></section><section class="card"><h3>Admin Notifications</h3><div id="notifications"></div></section></main><script type="module" src="/js/admin.js"></script></body></html>
